<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<title>Mis Ganancias Uber</title>
<style>
  :root { --bg:#f4f4f2; --card:#fff; --tx:#161616; --mut:#6b6b6b; --ok:#0a7d3b; --bad:#c0392b; --acc:#111; --line:#e3e3e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101010; --card:#1b1b1b; --tx:#f0f0ee; --mut:#999; --ok:#3ecf7a; --bad:#ff6b5b; --acc:#f0f0ee; --line:#2c2c2c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.4 system-ui,sans-serif; padding:16px; max-width:560px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 12px; }
  h2 { font-size:15px; margin:20px 0 8px; color:var(--mut); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .k { font-size:12px; color:var(--mut); }
  .v { font-size:22px; font-weight:700; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .big { grid-column:1/-1; }
  .big .v { font-size:30px; }
  input, select, button { font:inherit; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--tx); width:100%; }
  button { background:var(--acc); color:var(--bg); border:0; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--tx); border:1px solid var(--line); }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  .seg button { background:var(--card); color:var(--tx); border:1px solid var(--line); }
  .seg button.on { background:var(--acc); color:var(--bg); }
  form { display:grid; gap:10px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border:0; }
  .row small { color:var(--mut); display:block; }
  .x { width:auto; padding:6px 10px; background:transparent; color:var(--mut); border:1px solid var(--line); }
  .bar { height:10px; background:var(--line); border-radius:6px; overflow:hidden; margin-top:8px; }
  .bar i { display:block; height:100%; background:var(--ok); }
  .bar i.over { background:var(--bad); }
  .tools { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px; }
</style>
</head>
<body>
<h1>🚗 Mis Ganancias Uber</h1>

<input type="month" id="mes" aria-label="Mes">

<h2>Resumen del mes</h2>
<div class="grid">
  <div class="card big"><div class="k">Ganancia neta (ingresos − gastos)</div><div class="v" id="neta">$0</div></div>
  <div class="card"><div class="k">Ingresos</div><div class="v ok" id="ing">$0</div></div>
  <div class="card"><div class="k">Gastos totales</div><div class="v bad" id="gas">$0</div></div>
  <div class="card"><div class="k">Combustible</div><div class="v" id="comb">$0</div></div>
  <div class="card"><div class="k">Reparaciones</div><div class="v" id="rep">$0</div></div>
</div>

<h2>Fondo para reparaciones</h2>
<div class="card">
  <div style="display:flex;gap:10px;align-items:center">
    <span class="k" style="flex:1">Apartar % de los ingresos</span>
    <input id="pct" type="number" min="0" max="100" style="width:90px" inputmode="numeric">
  </div>
  <div class="k" style="margin-top:10px">Apartado: <b id="apartado">$0</b> · Gastado: <b id="gastadoRep">$0</b></div>
  <div class="bar"><i id="barra"></i></div>
  <div class="k" id="saldoRep" style="margin-top:6px"></div>
</div>

<h2>Hoy: cuánto apartar</h2>
<div class="card">
  <div class="k" id="hoyFecha"></div>
  <div class="v ok" id="hoyApartar">$0</div>
  <div class="k" id="hoyDetalle"></div>
</div>

<h2>Por día</h2>
<div class="card" id="dias"></div>

<h2>Agregar movimiento</h2>
<div class="card">
  <div class="seg">
    <button type="button" id="tIng" class="on">+ Ingreso</button>
    <button type="button" id="tGas">− Gasto</button>
  </div>
  <form id="f">
    <input type="number" id="monto" placeholder="Monto" inputmode="decimal" step="0.01" min="0" required>
    <select id="cat"></select>
    <input type="date" id="fecha" required>
    <input type="text" id="nota" placeholder="Nota (opcional)">
    <button type="submit">Guardar</button>
  </form>
</div>

<h2>Movimientos</h2>
<div class="card" id="lista"></div>

<div class="tools">
  <button class="ghost" id="exp">Exportar CSV</button>
  <button class="ghost" id="bak">Copia de seguridad</button>
</div>
<input type="file" id="imp" accept=".json" hidden>
<button class="ghost" id="res" style="margin-top:8px">Restaurar copia</button>

<script>
const CATS = {
  ingreso: ['Viajes Uber', 'Propinas', 'Bonos/Promociones', 'Otro ingreso'],
  gasto:   ['Combustible', 'Reparaciones', 'Mantenimiento', 'Lavado', 'Peajes', 'Seguro', 'Otro gasto']
};
const KEY = 'uber-ganancias-v1';
const $ = id => document.getElementById(id);
let tipo = 'ingreso';
let db = { items: [], pct: 10 };
try { db = Object.assign(db, JSON.parse(localStorage.getItem(KEY)) || {}); } catch {}

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} };
const money = n => '$' + Math.round(n).toLocaleString('es-AR');
const hoy = () => new Date().toISOString().slice(0, 10);

function setTipo(t) {
  tipo = t;
  $('tIng').classList.toggle('on', t === 'ingreso');
  $('tGas').classList.toggle('on', t === 'gasto');
  $('cat').innerHTML = CATS[t].map(c => `<option>${c}</option>`).join('');
}

function render() {
  const mes = $('mes').value;
  const items = db.items.filter(i => i.fecha.startsWith(mes)).sort((a, b) => b.fecha.localeCompare(a.fecha) || b.id - a.id);
  const sum = f => items.filter(f).reduce((s, i) => s + i.monto, 0);
  const ing = sum(i => i.tipo === 'ingreso');
  const gas = sum(i => i.tipo === 'gasto');
  const comb = sum(i => i.cat === 'Combustible');
  const rep = sum(i => i.cat === 'Reparaciones');
  const neta = ing - gas;

  $('ing').textContent = money(ing);
  $('gas').textContent = money(gas);
  $('comb').textContent = money(comb);
  $('rep').textContent = money(rep);
  $('neta').textContent = money(neta);
  $('neta').className = 'v ' + (neta >= 0 ? 'ok' : 'bad');

  const apart = ing * db.pct / 100;
  $('apartado').textContent = money(apart);
  $('gastadoRep').textContent = money(rep);
  const ratio = apart > 0 ? Math.min(rep / apart, 1) : (rep > 0 ? 1 : 0);
  $('barra').style.width = ratio * 100 + '%';
  $('barra').className = rep > apart ? 'over' : '';
  const saldo = apart - rep;
  $('saldoRep').textContent = saldo >= 0 ? `Te queda ${money(saldo)} del fondo` : `Te pasaste ${money(-saldo)} del fondo`;

  const h = hoy();
  const hi = db.items.filter(i => i.fecha === h);
  const hIng = hi.filter(i => i.tipo === 'ingreso').reduce((s, i) => s + i.monto, 0);
  const hGas = hi.filter(i => i.tipo === 'gasto').reduce((s, i) => s + i.monto, 0);
  $('hoyFecha').textContent = 'Hoy ' + h + ' · ' + db.pct + '% de tus ingresos';
  $('hoyApartar').textContent = money(hIng * db.pct / 100);
  $('hoyDetalle').textContent = `Ingresos ${money(hIng)} · Gastos ${money(hGas)} · Neta ${money(hIng - hGas)}`;

  const porDia = {};
  items.forEach(i => {
    const d = porDia[i.fecha] || (porDia[i.fecha] = { ing: 0, gas: 0 });
    d[i.tipo === 'ingreso' ? 'ing' : 'gas'] += i.monto;
  });
  const dias = Object.keys(porDia).sort().reverse();
  const max = Math.max(1, ...dias.map(d => porDia[d].ing));
  $('dias').innerHTML = dias.length ? dias.map(d => {
    const { ing: di, gas: dg } = porDia[d];
    const ap = di * db.pct / 100;
    return `<div class="row" style="display:block">
      <div style="display:flex;justify-content:space-between"><b>${d.slice(8)}/${d.slice(5, 7)}</b><span>Apartar <b>${money(ap)}</b></span></div>
      <div class="bar"><i style="width:${di / max * 100}%"></i></div>
      <small>Ingresos ${money(di)} · Gastos ${money(dg)} · Neta ${money(di - dg)}</small>
    </div>`;
  }).join('') : '<div class="k">Sin datos este mes.</div>';

  $('lista').innerHTML = items.length ? items.map(i => `
    <div class="row">
      <div>${i.cat}<small>${i.fecha}${i.nota ? ' · ' + esc(i.nota) : ''}</small></div>
      <div style="display:flex;gap:8px;align-items:center">
        <b class="${i.tipo === 'ingreso' ? 'ok' : 'bad'}">${i.tipo === 'ingreso' ? '+' : '−'}${money(i.monto)}</b>
        <button class="x" data-id="${i.id}" aria-label="Borrar">✕</button>
      </div>
    </div>`).join('') : '<div class="k">Sin movimientos este mes.</div>';
}

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

$('tIng').onclick = () => setTipo('ingreso');
$('tGas').onclick = () => setTipo('gasto');
$('mes').onchange = render;
$('pct').onchange = () => { db.pct = Math.max(0, Math.min(100, +$('pct').value || 0)); save(); render(); };

$('f').onsubmit = e => {
  e.preventDefault();
  const monto = parseFloat($('monto').value);
  if (!(monto > 0)) return;
  db.items.push({ id: Date.now(), tipo, cat: $('cat').value, monto, fecha: $('fecha').value, nota: $('nota').value.trim() });
  save();
  $('monto').value = ''; $('nota').value = '';
  $('mes').value = $('fecha').value.slice(0, 7);
  render();
};

$('lista').onclick = e => {
  const id = e.target.dataset.id;
  if (id && confirm('¿Borrar este movimiento?')) {
    db.items = db.items.filter(i => i.id != id);
    save(); render();
  }
};

function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
}
$('exp').onclick = () => {
  const rows = [['fecha', 'tipo', 'categoria', 'monto', 'nota']]
    .concat(db.items.map(i => [i.fecha, i.tipo, i.cat, i.monto, '"' + i.nota.replace(/"/g, '""') + '"']));
  download('uber-' + hoy() + '.csv', rows.map(r => r.join(',')).join('\n'), 'text/csv');
};
$('bak').onclick = () => download('uber-backup-' + hoy() + '.json', JSON.stringify(db), 'application/json');
$('res').onclick = () => $('imp').click();
$('imp').onchange = async e => {
  try {
    const d = JSON.parse(await e.target.files[0].text());
    if (!Array.isArray(d.items)) throw 0;
    if (!confirm('Esto reemplaza los datos actuales. ¿Continuar?')) return;
    db = { items: d.items, pct: +d.pct || 0 };
    save(); $('pct').value = db.pct; render();
  } catch { alert('Archivo inválido'); }
};

$('mes').value = hoy().slice(0, 7);
$('fecha').value = hoy();
$('pct').value = db.pct;
setTipo('ingreso');
render();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
